<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KITTEN RACK · VISUALES</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 28V12L3 3l8 6h10l8-6-3 9v16z' fill='%23111'/%3E%3Cellipse cx='12' cy='17' rx='2.5' ry='3' fill='%23ff7a1a'/%3E%3Cellipse cx='20' cy='17' rx='2.5' ry='3' fill='%23ff7a1a'/%3E%3C/svg%3E" />
  <style>
    @font-face { font-family: 'Barlow Condensed'; src: url('./fonts/BarlowCondensed-SemiBold.ttf') format('truetype'); font-weight: 600; font-display: swap; }
    @font-face { font-family: 'FM1 5x7'; src: url('./fonts/FM1-5x7.ttf') format('truetype'); font-display: swap; }
    :root { --bg: #000; --orange: #ff7a1a; --dim: #8a3c08; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--orange); overflow: hidden; font-family: 'Barlow Condensed', sans-serif; }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; display: block; }
    #ui { position: fixed; left: 0; right: 0; top: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px;
      background: rgba(0, 0, 0, .78); border-bottom: 2px solid var(--orange); transition: opacity .4s; z-index: 2; }
    #ui.gone { opacity: 0; pointer-events: none; }
    #ui b { font-size: 22px; letter-spacing: 1px; margin-right: 6px; }
    button, select { font: 600 15px 'Barlow Condensed', sans-serif; text-transform: uppercase; color: var(--orange); background: #000;
      border: 1px solid var(--dim); padding: 4px 10px; cursor: pointer; }
    button.on { background: var(--orange); color: #000; }
    label { font-size: 14px; display: flex; gap: 6px; align-items: center; }
    input[type=range] { accent-color: var(--orange); width: 110px; }
    #state { font-family: 'FM1 5x7', monospace; font-size: 12px; color: var(--dim); }
    #help { position: fixed; inset: 0; display: grid; place-items: center; z-index: 1; pointer-events: none; text-align: center; }
    #help div { background: #000; border: 2px solid var(--orange); padding: 22px 30px; font-family: 'FM1 5x7', monospace; font-size: 14px; line-height: 1.8; }
    #help button { pointer-events: auto; font-size: 22px; padding: 10px 24px; margin-top: 16px; }
  </style>
</head>
<body>
  <canvas id="screen"></canvas>
  <div id="ui">
    <b>VISUALES</b>
    <select id="input" title="La entrada de audio: elegí la del FM-1"></select>
    <button id="m-scope" data-mode="scope">OSCILOSCOPIO</button>
    <button id="m-vj" data-mode="vj">VISUAL</button>
    <button id="m-both" data-mode="both">LOS DOS</button>
    <button id="scene" title="Flechas: la escena anterior / la siguiente">ESCENA 1/5</button>
    <button id="auto" class="on" title="Cambia sola cada 10 s o con un golpe después de 5 s">AUTO</button>
    <label>DETALLE <input id="cells" type="range" min="30" max="160" step="10" value="60" /></label>
    <button id="midi" title="Las notas y el reloj MIDI del FM-1 también hacen latir la imagen">MIDI</button>
    <button id="full">PANTALLA COMPLETA</button>
    <span id="state"></span>
  </div>
  <div id="help"><div>
    CONECTÁ EL FM-1 POR USB Y TOCÁ<br />
    LA IMAGEN SIGUE EL AUDIO QUE SALE POR USB<br />
    1 OSCILOSCOPIO · 2 VISUAL · 3 LOS DOS · ← → ESCENA<br />
    F PANTALLA COMPLETA · H ESCONDE LA BARRA<br />
    <button id="start">EMPEZAR</button>
  </div></div>
  <script type="module" src="./src/visuals/main.ts"></script>
</body>
</html>
