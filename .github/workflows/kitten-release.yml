# KITTEN RACK: a release with its installer. Pushing a tag vX.Y.Z (or Actions > kitten-release > Run workflow, which makes the tag) builds the
# firmware (identity FM-1_79Y for X.Y), runs the host tests and publishes a GitHub pre-release with
# KittenRack-instalador-X.Y.Z.zip (instalar_kitten_rack.py, fm1_install.py, the .fwsc, SHA256SUMS, LEEME.txt) and the .fwsc.
name: kitten-release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "the release tag (vX.Y.Z): made on the commit this runs on"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: JieLi toolchain and AC79 SDK (cached)
        id: jieli
        uses: actions/cache@v5
        with:
          path: ~/.jieli
          key: jieli-AC79NN_SDK_V1.2.1_2023-12-13-toolchain-v1
      - name: fetch the toolchain and the three SDK files
        if: steps.jieli.outputs.cache-hit != 'true'
        run: |
          tools/get_toolchain.sh
          git clone --filter=blob:none --no-checkout --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
            https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/.jieli/ac79-sdk
          git -C ~/.jieli/ac79-sdk sparse-checkout set cpu/wl82/tools
          git -C ~/.jieli/ac79-sdk checkout
      - name: the generated headers are current
        working-directory: web
        run: |
          npm run export-defs
          git diff --exit-code ../firmware/src/defs.h ../firmware/src/presets.h ../firmware/test/presets_matryoshka.h
      - name: build the release, no warnings
        id: build
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          V="${TAG#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          export JIELI_TOOLCHAIN="$HOME/.jieli/toolchain" AC79_SDK="$HOME/.jieli/ac79-sdk"
          mkdir -p build
          python3 tools/build.py --release "$V" 2>&1 | tee build/build.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -E "warning:" build/build.log | grep -v "SDK .* differs"; then echo "::error::compiler warnings"; exit 1; fi
          grep -E "image [0-9]+ B|pool [0-9]+ B of|identity" build/build.log
      - name: host tests
        run: |
          tools/golden.sh
          tools/usb_test.sh
          tools/panel_test.sh
          tools/preset_test.sh
          tools/patch_edit_test.sh
          tools/bank_test.sh
      - name: the installer folder
        env:
          V: ${{ steps.build.outputs.version }}
        run: |
          D="KittenRack-instalador-$V"
          mkdir -p "dist/$D"
          cp "build/matryoshka-$V.fwsc" "dist/$D/kitten-rack-$V.fwsc"
          cp tools/instalar_kitten_rack.py tools/fm1_install.py "dist/$D/"
          cp tools/LEEME-instalador.txt "dist/$D/LEEME.txt"
          (cd "dist/$D" && sha256sum "kitten-rack-$V.fwsc" > SHA256SUMS)
          (cd dist && zip -r "$D.zip" "$D")
          cp "dist/$D/kitten-rack-$V.fwsc" "dist/$D/SHA256SUMS" dist/
      - name: publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          V: ${{ steps.build.outputs.version }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "KITTEN RACK $V (prueba)" \
            --notes "Primera versión para probar en el FM-1. Bajá KittenRack-instalador-$V.zip, descomprimilo y abrí instalar_kitten_rack.py (instrucciones en LEEME.txt). Sin probar todavía en hardware: respaldá tus datos antes." \
            "dist/KittenRack-instalador-$V.zip" "dist/kitten-rack-$V.fwsc" dist/SHA256SUMS
