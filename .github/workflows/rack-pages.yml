# KITTEN RACK: the rack editor on GitHub Pages (https://blackkittendevices.github.io/kitten-rack/), a page of its own on
# https, where the browser lets it use MIDI (the claude.ai preview does not). Every push to main that touches web/
# rebuilds it into the gh-pages branch, which Pages serves.
name: rack-pages
on:
  push:
    branches: [main]
    paths: [web/**, firmware/src/**, firmware/wasm/**, firmware/test/host_ui.h, .github/workflows/rack-pages.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rack-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: web
      - name: the FM-1's screens as WebAssembly (play.html)
        run: |
          sudo apt-get install -y --no-install-recommends clang lld
          npm run fm1-wasm
        working-directory: web
      - run: npx vite build --base /kitten-rack/ --outDir ../rack-site --emptyOutDir
        working-directory: web
      - name: the gh-pages branch
        run: |
          cd rack-site
          cp rack.html index.html
          rm -rf brand review
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "rack editor from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
