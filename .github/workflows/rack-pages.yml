# KITTEN RACK: the rack editor on GitHub Pages (https://blackkittendevices.github.io/kitten-rack/), a page of its own on
# https, where the browser lets it use MIDI (the claude.ai preview does not). Every push to main that touches web/.
# Needs Pages turned on once: the repository's Settings > Pages > Source: GitHub Actions.
name: rack-pages
on:
  push:
    branches: [main]
    paths: [web/**, .github/workflows/rack-pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: rack-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx vite build --base /kitten-rack/ --outDir ../rack-site --emptyOutDir
      - run: cp ../rack-site/rack.html ../rack-site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: rack-site
      - id: deploy
        uses: actions/deploy-pages@v4
